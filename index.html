<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faithfull Stickers — Custom die-cut stickers</title>
    <meta name="description" content="Design your own die-cut sticker sheets. Upload art, arrange an A4 sheet, and we print and ship it." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='16' fill='%232563eb' transform='rotate(-6 32 32)'/%3E%3Ctext x='32' y='45' font-family='Arial, sans-serif' font-size='34' font-weight='bold' fill='white' text-anchor='middle' transform='rotate(-6 32 32)'%3EF%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong mode.
      try {
        var stored = localStorage.getItem('faithfull-theme')
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
